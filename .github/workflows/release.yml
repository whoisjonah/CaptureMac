name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      HAS_CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test
        run: scripts/test.sh

      - name: Import signing certificate
        if: env.HAS_CERTIFICATE == 'true'
        env:
          SIGNING_CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p ci "$keychain"
          echo "$SIGNING_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/identity.p12"
          security import "$RUNNER_TEMP/identity.p12" -k "$keychain" -P "$SIGNING_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k ci "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "SIGN_IDENTITY=CaptureMac Release" >> "$GITHUB_ENV"

      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
          ARCHS: arm64 x86_64
        run: |
          export VERSION="${VERSION#v}"
          scripts/build-app.sh
          ditto -c -k --keepParent build/CaptureMac.app build/CaptureMac.zip

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" build/CaptureMac.zip --generate-notes
